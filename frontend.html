<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mamba + React Fullstack Dashboard</title>
    <!-- React & Tailwind CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0f111a] text-white min-h-screen flex items-center justify-center p-6">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [status, setStatus] = React.useState("Connecting...");
            const [title, setTitle] = React.useState("");
            const [content, setContent] = React.useState("");
            const [notes, setNotes] = React.useState([]);

            // Fetch initial data from Mamba Native C++ Backend
            React.useEffect(() => {
                fetch('http://localhost:8000/api/notes')
                    .then(res => res.json())
                    .then(data => setStatus(data.message))
                    .catch(() => setStatus("Offline / Start Mamba Backend"));
            }, []);

            const handleSubmit = (e) => {
                e.preventDefault();
                fetch('http://localhost:8000/api/notes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content })
                })
                    .then(res => res.json())
                    .then(data => {
                        setNotes([...notes, { title: data.title, content: data.content }]);
                        setTitle("");
                        setContent("");
                    });
            };

            return (
                <div class="max-w-md w-full bg-[#181a24] p-8 rounded-2xl border border-gray-800 shadow-2xl">
                    <div class="text-center mb-6">
                        <h1 class="text-3xl font-extrabold text-[#00e676]">🐍 Mamba + React</h1>
                        <p class="text-gray-400 text-sm mt-1">Fullstack App Powered by Compiled Native C++</p>
                        <span class="inline-block mt-3 px-3 py-1 bg-gray-800 text-[#00e676] rounded-full text-xs font-mono">
                            {status}
                        </span>
                    </div>

                    <form onSubmit={handleSubmit} class="space-y-4">
                        <input
                            type="text"
                            placeholder="Note Title"
                            value={title}
                            onChange={(e) => setTitle(e.target.value)}
                            class="w-full bg-[#0f111a] border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-[#00e676]"
                            required
                        />
                        <textarea
                            placeholder="Note Content"
                            value={content}
                            onChange={(e) => setContent(e.target.value)}
                            class="w-full bg-[#0f111a] border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-[#00e676]"
                            required
                        ></textarea>
                        <button type="submit" class="w-full bg-[#00e676] hover:bg-[#00c853] text-black font-bold py-3 rounded-lg transition duration-200">
                            Save Note via Mamba Backend
                        </button>
                    </form>

                    <div class="mt-8">
                        <h2 class="text-lg font-bold text-gray-300 mb-3">Saved Notes (SQLite):</h2>
                        <div class="space-y-3">
                            {notes.length === 0 ? <p class="text-gray-500 text-sm text-center">No notes added yet.</p> : null}
                            {notes.map((note, index) => (
                                <div key={index} class="bg-[#0f111a] p-4 rounded-lg border border-gray-800">
                                    <h3 class="font-bold text-[#00e676]">{note.title}</h3>
                                    <p class="text-gray-300 text-sm mt-1">{note.content}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
